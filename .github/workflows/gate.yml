name: HSMA Gate

on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip

      - name: Generate goldens
        run: |
          mkdir -p generated
          python3 scripts/gen_run_new.py --out generated 2>&1 | tail -5

      - name: Configure build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-std=c++20"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run the full gate
        run: ./scripts/gate.sh

      - name: Gate receipt
        if: always()
        run: |
          echo "═══════════════════════════════"
          echo "  HSMA Gate: $(tail -1 build/gate_receipt.txt 2>/dev/null || echo 'check the log above')"
          echo "  Goldens: $(ls generated/ | wc -l) headers"
          echo "  Tests: $(ctest --test-dir build 2>/dev/null | grep -o '[0-9]*% tests passed' || echo 'see above')"
          echo "═══════════════════════════════"
